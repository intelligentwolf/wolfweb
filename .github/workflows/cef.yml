# WolfWeb's own CEF (Chromium Embedded Framework) with H.264/AAC, built on GitHub's free runners and published as a
# release (tag cef-<CEF version>) for WolfWeb's builds to use. A free runner has 4 cores and a job may run for at
# most 6 hours, so the build is split: prepare, then up to 10 build jobs of about 4 hours each (each carries on
# from where the last stopped; the rest are skipped once it's done), then package. The same pattern as
# ungoogled-chromium-portablelinux (.github/workflows/build-steps.yml). Steps: build/cef/build.sh ci-*.
name: cef

on:
  workflow_dispatch:

permissions:
  contents: write

# One CEF build at a time: they share the build-state artifact name.
concurrency:
  group: cef
  cancel-in-progress: false

jobs:
  prepare:
    uses: ./.github/workflows/cef-part.yml
    with: { step: ci-prepare }

  build_01:
    needs: prepare
    uses: ./.github/workflows/cef-part.yml
    with: { step: ci-build }

  build_02:
    needs: build_01
    if: needs.build_01.outputs.status == 'running'
    uses: ./.github/workflows/cef-part.yml
    with: { step: ci-build }

  build_03:
    needs: build_02
    if: needs.build_02.outputs.status == 'running'
    uses: ./.github/workflows/cef-part.yml
    with: { step: ci-build }

  build_04:
    needs: build_03
    if: needs.build_03.outputs.status == 'running'
    uses: ./.github/workflows/cef-part.yml
    with: { step: ci-build }

  build_05:
    needs: build_04
    if: needs.build_04.outputs.status == 'running'
    uses: ./.github/workflows/cef-part.yml
    with: { step: ci-build }

  build_06:
    needs: build_05
    if: needs.build_05.outputs.status == 'running'
    uses: ./.github/workflows/cef-part.yml
    with: { step: ci-build }

  build_07:
    needs: build_06
    if: needs.build_06.outputs.status == 'running'
    uses: ./.github/workflows/cef-part.yml
    with: { step: ci-build }

  build_08:
    needs: build_07
    if: needs.build_07.outputs.status == 'running'
    uses: ./.github/workflows/cef-part.yml
    with: { step: ci-build }

  build_09:
    needs: build_08
    if: needs.build_08.outputs.status == 'running'
    uses: ./.github/workflows/cef-part.yml
    with: { step: ci-build }

  build_10:
    needs: build_09
    if: needs.build_09.outputs.status == 'running'
    uses: ./.github/workflows/cef-part.yml
    with: { step: ci-build, final: true }

  package:
    needs: build_10
    if: ${{ !cancelled() && !failure() && contains(fromJSON('["success", "skipped"]'), needs.build_10.result) }}
    uses: ./.github/workflows/cef-part.yml
    with: { step: ci-package }
