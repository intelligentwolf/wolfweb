[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Builds WolfWeb bundles: cargo run -p xtask -- bundle [--release]"

[dependencies]
anyhow = "1"

# macOS only: cef-rs's app-bundle builder (cef/src/build_util/mac.rs bundle()) makes the .app, its five helper apps
# and their Info.plists exactly as CEF expects.
[target.'cfg(target_os = "macos")'.dependencies]
cef = { version = "=156.3.0", default-features = false, features = ["build-util"] }
semver = "1"

# Windows only: the resource-update API that puts WolfWeb's icon into wolfweb.exe (src/win_icon.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
